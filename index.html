<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ނާޒް ޓީވީ</title>
<style>
@font-face { font-family: "Faruma"; src: url("Faruma.ttf") format("truetype"); font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; }
body { font-family: "Faruma", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; font-family: "Faruma", "Helvetica Neue", Arial, sans-serif; }

/* 1920x1080 stage, scaled to fit any TV browser size */
#stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden;
  transform-origin: 0 0; background: #05070c; }

/* hero background (two layers, crossfade = cheap on TV chips) */
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; }
.bg.on { opacity: 1; }
#wall { position: absolute; inset: 0; background-size: cover; background-position: center top; }
#wallFade { display: none; }
/* iOS-style: full-bleed photo, minimal UI */
body.hasWall .bg { display: none; }
body.hasWall #shade { background:
  linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 70%, rgba(0,0,0,.55) 86%, rgba(0,0,0,.75) 100%); }
body.hasWall #hero { top: 112px; right: 110px; width: 380px; }
body.hasWall #greet { font-size: 26px; margin: 0; opacity: .95; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
body.hasWall #heroTitle, body.hasWall #heroDesc, body.hasWall #heroMeta { display: none; }
body.hasWall #top { text-shadow: 0 2px 12px rgba(0,0,0,.6); }
body.hasWall #rowsWrap { top: 790px; height: 290px; padding-top: 0; }
body.hasWall .row { height: 290px; }
body.hasWall .row.dim { opacity: 0; }
body.hasWall .rowTitle { height: 46px; font-size: 26px; opacity: .95; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
body.hasWall .label { display: none; }
body.hasWall .tile { box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#svPhoto { position: absolute; inset: 0; background-size: cover; background-position: center top; opacity: 0; transition: opacity 2s; }
#svPhoto.on { opacity: 1; }
#svText { text-shadow: 0 4px 30px rgba(0,0,0,.6); }
#svShade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 40%); display: none; }
#svPhoto.on + #svShade { display: block; }
#saver.photo #svText { top: auto; bottom: 60px; right: 50px; left: auto; width: 380px; transform: none; text-align: center; }
#saver.photo #svClock { font-size: 120px; }
#saver.photo #svDate { font-size: 40px; margin-top: 14px; }
#saver.photo #svTemp { font-size: 32px; }
#shade { position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(5,7,12,0) 0%, rgba(5,7,12,.35) 45%, rgba(5,7,12,.92) 62%, #05070c 78%); }

/* top bar */
#top { position: absolute; top: 46px; right: 110px; left: 110px; height: 60px; display: flex;
  align-items: center; justify-content: space-between; }
#brand { font-size: 34px; opacity: .9; }
#brand b { color: #ff9f0a; font-weight: normal; }
#topInfo { display: flex; align-items: center; gap: 34px; font-size: 30px; opacity: .92; }
#topTemp { display: flex; align-items: center; gap: 10px; }
#topTemp svg { width: 40px; height: 40px; }
#topClock { font-size: 40px; }

/* hero text */
#hero { position: absolute; top: 210px; right: 110px; width: 1050px; transition: opacity .35s ease, transform .35s ease; }
#hero.swap { opacity: 0; transform: translateY(12px); }
#greet { font-size: 30px; opacity: .7; margin-bottom: 18px; }
#heroTitle { font-size: 104px; line-height: 1.25; text-shadow: 0 4px 30px rgba(0,0,0,.4); }
#heroDesc { font-size: 36px; opacity: .85; margin-top: 14px; line-height: 1.6; }
#heroMeta { margin-top: 28px; display: flex; gap: 18px; align-items: center; font-size: 28px; }
.pill { padding: 6px 22px 10px; border-radius: 40px; background: rgba(255,255,255,.16); }
.pill.live { background: #ff2d2d; }
.pill.live:before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  background: #fff; margin-left: 10px; vertical-align: middle; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
#hint { opacity: .6; }

/* rows */
#rowsWrap { position: absolute; top: 600px; right: 0; left: 0; height: 480px; overflow: hidden; padding-top: 24px; }
#rows { position: absolute; top: 0; right: 0; left: 0; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.row { height: 330px; padding-right: 110px; transition: opacity .4s; }
.row.dim { opacity: .45; }
.rowTitle { font-size: 30px; opacity: .75; height: 54px; }
.track { display: flex; gap: 44px; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.app { flex: 0 0 auto; width: 340px; }
.tile { position: relative; width: 340px; height: 200px; border-radius: 26px; overflow: hidden;
  transition: transform .25s cubic-bezier(.2,.8,.2,1); transform: translateZ(0); }
.tile .ic { position: absolute; top: 30px; right: 30px; width: 54px; height: 54px; opacity: .95; }
.tile .nm { position: absolute; bottom: 22px; right: 28px; left: 28px; font-size: 38px; line-height: 1.3;
  text-shadow: 0 2px 10px rgba(0,0,0,.3); white-space: nowrap; overflow: hidden; }
.tile .lv { position: absolute; top: 30px; left: 26px; font-size: 20px; padding: 2px 14px 6px; border-radius: 20px;
  background: rgba(0,0,0,.35); }
.tile .lv:before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: #ff3b30; margin-left: 7px; vertical-align: middle; }
.tile .shine { position: absolute; top: -50%; left: -60%; width: 60%; height: 200%; opacity: 0;
  background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.28), rgba(255,255,255,0));
  transform: rotate(18deg); }
.tile .glow { position: absolute; inset: 0; border-radius: 26px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.9); opacity: 0; transition: opacity .25s; }
.label { font-size: 26px; margin-top: 18px; opacity: 0; transition: opacity .25s; text-align: center; }
.app.f .tile { transform: scale(1.12) translateY(-6px); box-shadow: 0 26px 50px rgba(0,0,0,.6); }
.app.f .glow { opacity: 1; }
.app.f .label { opacity: 1; }
.app.f .shine { animation: shine 1.1s ease .15s 1; }
@keyframes shine { 0% { left: -60%; opacity: 1; } 100% { left: 130%; opacity: 1; } }

/* full screen panels */
.panel { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.panel.on { opacity: 1; visibility: visible; transition: opacity .4s; }

/* weather */
#weather { background: linear-gradient(160deg, #1d6fe0 0%, #0a2f73 55%, #050d24 100%); padding: 110px 130px; }
#wTitle { font-size: 40px; opacity: .8; }
#wNow { display: flex; align-items: center; gap: 60px; margin-top: 40px; }
#wNow svg { width: 220px; height: 220px; }
#wTemp { font-size: 200px; line-height: 1; }
#wCond { font-size: 56px; margin-top: 10px; }
#wStats { display: flex; gap: 70px; margin-top: 46px; font-size: 32px; opacity: .9; }
#wStats div span { display: block; font-size: 24px; opacity: .7; margin-bottom: 6px; }
#wDays { display: flex; gap: 26px; margin-top: 50px; }
.day { flex: 1; background: rgba(255,255,255,.1); border-radius: 26px; padding: 26px 20px 30px; text-align: center; font-size: 30px; }
.day svg { width: 80px; height: 80px; margin: 12px auto; display: block; }
.day .hi { font-size: 38px; }
.day .lo { opacity: .6; }
.day .rp { font-size: 22px; opacity: .75; margin-top: 8px; }
.back { position: absolute; bottom: 34px; left: 130px; font-size: 26px; opacity: .6; }

/* screensaver */
#saver { background: #000; text-align: center; }
.sv { position: absolute; inset: -10%; opacity: 0; transition: opacity 6s ease; }
.sv.on { opacity: 1; }
#svText { position: absolute; top: 58%; left: 0; right: 0; transform: translateY(-50%); }
#svClock { font-size: 260px; line-height: 1; }
#svDate { font-size: 52px; opacity: .85; margin-top: 30px; }
#svTemp { font-size: 40px; opacity: .7; margin-top: 18px; }

/* opening an app */
#launch { background: #000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 30px; }
#launchTile { width: 340px; height: 200px; border-radius: 26px; transform: scale(.6); transition: transform .5s cubic-bezier(.2,.8,.2,1); position: relative; overflow: hidden; }
#launch.on #launchTile { transform: scale(1.4); }
#launchText { font-size: 34px; opacity: .7; margin-top: 60px; }

#toast { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(40,40,40,.9);
  padding: 14px 34px 18px; border-radius: 30px; font-size: 26px; opacity: 0; transition: opacity .3s; }
#toast.on { opacity: 1; }

/* ---- compact iOS-style grid ---- */
#rowsWrap { top: 700px; height: 340px; padding-top: 16px; }
.row { height: 140px; padding-right: 110px; }
.track { gap: 40px; }
.app { width: 200px; }
.tile { width: 200px; height: 118px; border-radius: 22px; }
.tile .glow { border-radius: 22px; }
.tile .ic { top: 14px; right: 16px; width: 36px; height: 36px; }
.tile .nm { bottom: 10px; right: 16px; left: 12px; font-size: 24px; }
.tile .lv { top: 14px; left: 12px; font-size: 15px; padding: 1px 10px 4px; }
.tile .lv:before { width: 7px; height: 7px; margin-left: 5px; }
.label { display: none; }
.app.f .tile { transform: scale(1.14); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
body.hasWall #rowsWrap { top: 782px; height: 298px; padding-top: 14px; }
body.hasWall .row { height: 140px; }

/* ---- full-screen player ---- */
#player { background: #000; }
#vid { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
#pInfo { position: absolute; top: 0; right: 0; left: 0; padding: 60px 110px 120px;
  background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0)); transition: opacity .5s; }
#pInfo.hide { opacity: 0; }
#pName { font-size: 64px; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
#pSub { font-size: 26px; margin-top: 12px; opacity: .9; }
#pMsg { position: absolute; top: 50%; left: 0; right: 0; text-align: center; font-size: 34px; transform: translateY(-50%); opacity: .85; }
.spin { display: inline-block; width: 46px; height: 46px; border: 5px solid rgba(255,255,255,.25); border-top-color: #fff;
  border-radius: 50%; animation: sp 1s linear infinite; vertical-align: middle; margin-left: 18px; }
@keyframes sp { to { transform: rotate(360deg); } }
/* 8 columns so all channels fit */
.app { width: 180px; }
.tile { width: 180px; height: 106px; }
.tile .nm { font-size: 22px; }
.track { gap: 34px; }
</style>
</head>
<body>
<div id="stage">
  <div id="wall"></div><div id="wallFade"></div><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <div id="shade"></div>

  <div id="top">
    <div id="brand"></div>
    <div id="topInfo">
      <div id="topTemp"></div>
      <div id="topClock"></div>
    </div>
  </div>

  <div id="hero">
    <div id="greet"></div>
    <div id="heroTitle"></div>
    <div id="heroDesc"></div>
    <div id="heroMeta"></div>
  </div>

  <div id="rowsWrap"><div id="rows"></div></div>

  <div class="panel" id="weather">
    <div id="wTitle"></div>
    <div id="wNow"><div id="wIcon"></div><div><div id="wTemp"></div><div id="wCond"></div></div></div>
    <div id="wStats"></div>
    <div id="wDays"></div>
    <div class="back">ފަހަތަށް ދިއުމަށް ރިމޯޓުގެ Back ފިތާލާ</div>
  </div>

  <div class="panel" id="saver">
    <div class="sv" id="svA"></div><div class="sv" id="svB"></div><div id="svPhoto"></div><div id="svShade"></div>
    <div id="svText"><div id="svClock"></div><div id="svDate"></div><div id="svTemp"></div></div>
  </div>

  <div class="panel" id="launch"><div id="launchTile"></div><div id="launchText">ހުޅުވަނީ...</div></div>
  <div class="panel" id="player">
    <video id="vid" autoplay playsinline></video>
    <div id="pInfo"><div id="pName"></div><div id="pSub"><span class="pill live">ލައިވް</span> <span id="pHint">ޗެނަލް ބަދަލުކުރުމަށް މަތި / ތިރި · ނުކުތުމަށް Back</span></div></div>
    <div id="pMsg"></div>
  </div>
  <div id="toast"></div>
</div>

<script src="channels.js"></script>
<script src="hls.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  /* all apps from channels.js laid out as a 7-wide grid (iOS home style) */
  var COLS = 8, ROWS = [], all = [];
  for (var g = 0; g < window.ROWS.length; g++) all = all.concat(window.ROWS[g].apps);
  for (var c = 0; c < all.length; c += COLS) ROWS.push({ title: "", apps: all.slice(c, c + COLS) });
  var stage = $("stage");

  /* ---------- scale stage ---------- */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
    stage.style.left = ((window.innerWidth - 1920 * s) / 2) + "px";
    stage.style.top = ((window.innerHeight - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", fit); fit();

  /* ---------- storage (safe) ---------- */
  function sget(store, k) { try { return window[store].getItem(k); } catch (e) { return null; } }
  function sset(store, k, v) { try { window[store].setItem(k, v); } catch (e) {} }

  /* ---------- icons ---------- */
  var ICONS = {
    play: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#fff" stroke-width="5"/><path d="M26 20l18 12-18 12z" fill="#fff"/></svg>',
    tv: '<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><rect x="6" y="16" width="52" height="34" rx="6"/><path d="M22 6l10 10 10-10M22 58h20"/></svg>',
    news: '<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><rect x="8" y="10" width="48" height="44" rx="6"/><path d="M18 24h28M18 34h28M18 44h16"/></svg>',
    radio: '<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><circle cx="32" cy="34" r="6" fill="#fff"/><path d="M20 22a17 17 0 0 0 0 24M44 22a17 17 0 0 1 0 24M12 14a28 28 0 0 0 0 40M52 14a28 28 0 0 1 0 40"/></svg>',
    cloud: '<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="11" fill="#ffd60a"/><path d="M20 50h28a10 10 0 0 0 0-20 14 14 0 0 0-27 3 9 9 0 0 0-1 17z" fill="#fff"/></svg>'
  };
  function wxIcon(code, day) {
    var sun = day === 0 ? '<circle cx="30" cy="28" r="14" fill="#e6e6f0"/><circle cx="36" cy="23" r="12" fill="#0a2f73"/>'
                        : '<circle cx="32" cy="30" r="13" fill="#ffd60a"/><g stroke="#ffd60a" stroke-width="4" stroke-linecap="round"><path d="M32 6v6M32 48v6M8 30h6M50 30h6M15 13l4 4M45 43l4 4M15 47l4-4M45 17l4-4"/></g>';
    var cloud = '<path d="M18 52h30a11 11 0 0 0 0-22 15 15 0 0 0-29 3 10 10 0 0 0-1 19z" fill="#fff"/>';
    var rain = '<g stroke="#64d2ff" stroke-width="4" stroke-linecap="round"><path d="M24 56l-3 6M34 56l-3 6M44 56l-3 6"/></g>';
    var bolt = '<path d="M34 50l-8 10h7l-3 8 10-12h-7l3-6z" fill="#ffd60a"/>';
    var inner;
    if (code === 0) inner = sun;
    else if (code <= 2) inner = '<g transform="translate(6,-6) scale(.8)">' + sun + '</g>' + cloud;
    else if (code === 3 || code === 45 || code === 48) inner = cloud;
    else if (code >= 95) inner = '<g transform="translate(0,-6)">' + cloud + '</g>' + bolt;
    else inner = '<g transform="translate(0,-6)">' + cloud + '</g>' + rain;
    return '<svg viewBox="0 0 64 70">' + inner + '</svg>';
  }
  function wxText(c) {
    if (c === 0) return "ސާފު އުޑު";
    if (c <= 2) return "ބައެއް ވިލާ";
    if (c === 3) return "ވިލާގަނޑު";
    if (c === 45 || c === 48) return "ފޮގު";
    if (c >= 51 && c <= 57) return "ލުއި ވާރޭ";
    if (c === 65 || c === 82) return "ގަދަ ވާރޭ";
    if (c >= 95) return "ގުގުރާ ވާރޭ";
    return "ވާރޭ";
  }

  /* ---------- dates & time in Dhivehi ---------- */
  var DAYS = ["އާދިއްތަ", "ހޯމަ", "އަންގާރަ", "ބުދަ", "ބުރާސްފަތި", "ހުކުރު", "ހޮނިހިރު"];
  var MONTHS = ["ޖަނަވަރީ", "ފެބްރުއަރީ", "މާރިޗު", "އޭޕްރީލް", "މޭ", "ޖޫން", "ޖުލައި", "އޮގަސްޓު", "ސެޕްޓެމްބަރު", "އޮކްޓޫބަރު", "ނޮވެމްބަރު", "ޑިސެމްބަރު"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function timeStr(d, withSuffix) {
    var h = d.getHours(), m = pad(d.getMinutes());
    if (SETTINGS.clock24h) return '<span class="ltr">' + pad(h) + ":" + m + "</span>";
    var suf = h < 12 ? "މކ" : "މފ";
    h = h % 12; if (h === 0) h = 12;
    return '<span class="ltr">' + h + ":" + m + "</span>" + (withSuffix ? " " + suf : "");
  }
  function dateStr(d) { return DAYS[d.getDay()] + "، " + d.getDate() + " " + MONTHS[d.getMonth()]; }
  function greeting(h) {
    if (h >= 4 && h < 12) return "ބާއްޖަވެރި ހެނދުނެއް";
    if (h >= 12 && h < 15) return "ބާއްޖަވެރި މެންދުރެއް";
    if (h >= 15 && h < 18) return "ބާއްޖަވެރި ހަވީރެއް";
    return "ބާއްޖަވެރި ރެއެއް";
  }

  /* ---------- build rows ---------- */
  $("brand").innerHTML = SETTINGS.brand;
  if (SETTINGS.wallpaper) {
    var wimg = new Image();
    wimg.onload = function () {
      var u = 'url("' + SETTINGS.wallpaper + '")';
      $("wall").style.backgroundImage = u; $("svPhoto").style.backgroundImage = u;
      document.body.className = "hasWall";
    };
    wimg.src = SETTINGS.wallpaper;
  }
  var rowsEl = $("rows"), rowEls = [], appEls = [];
  ROWS.forEach(function (row, r) {
    var re = document.createElement("div"); re.className = "row";
    var html = '<div class="track">';
    row.apps.forEach(function (a, i) {
      html += '<div class="app" data-r="' + r + '" data-i="' + i + '"><div class="tile" style="background:linear-gradient(135deg,' + a.color[0] + ',' + a.color[1] + ')">' +
        '<div class="ic">' + (ICONS[a.icon] || ICONS.tv) + '</div>' + (a.live ? '<div class="lv">ލައިވް</div>' : '') +
        '<div class="nm">' + a.name + '</div><div class="shine"></div><div class="glow"></div></div><div class="label">' + a.name + '</div></div>';
    });
    re.innerHTML = html + "</div>";
    rowsEl.appendChild(re); rowEls.push(re);
    appEls.push(re.querySelectorAll(".app"));
  });

  /* ---------- focus ---------- */
  var cur = { r: 0, i: 0 }, mem = [];
  ROWS.forEach(function () { mem.push(0); });
  var saved = sget("sessionStorage", "naaz_focus");
  if (saved) { try { var p = JSON.parse(saved); if (ROWS[p.r] && ROWS[p.r].apps[p.i]) { cur = p; mem[p.r] = p.i; } } catch (e) {} }

  var bgFlip = false, heroTimer = null, lastWx = null;
  function setBg(a) {
    var el = bgFlip ? $("bgA") : $("bgB"), other = bgFlip ? $("bgB") : $("bgA");
    el.style.background = "radial-gradient(ellipse 70% 90% at 75% 20%," + a.color[0] + " 0%, transparent 70%)," +
      "radial-gradient(ellipse 60% 80% at 15% 0%," + a.color[1] + " 0%, transparent 70%), #05070c";
    el.className = "bg on"; other.className = "bg"; bgFlip = !bgFlip;
  }
  function heroMeta(a) {
    var m = "";
    if (a.live) m += '<span class="pill live">ލައިވް</span>';
    if (a.type === "weather" && lastWx) m += '<span class="pill"><span class="ltr">' + Math.round(lastWx.current.temperature_2m) + "°</span> " + wxText(lastWx.current.weather_code) + "</span>";
    m += '<span id="hint">ހުޅުވުމަށް OK ފިތާލާ</span>';
    return m;
  }
  function paintHero(a) {
    var h = $("hero"); h.className = "swap";
    clearTimeout(heroTimer);
    heroTimer = setTimeout(function () {
      $("heroTitle").innerHTML = a.name; $("heroDesc").innerHTML = a.desc || "";
      $("heroMeta").innerHTML = heroMeta(a); h.className = "";
    }, 180);
    setBg(a);
  }
  var TILE = 214, VISIBLE = 8, ROWH = 140;
  function focus(r, i) {
    var old = appEls[cur.r][cur.i]; if (old) old.className = "app";
    cur = { r: r, i: i }; mem[r] = i;
    appEls[r][i].className = "app f";
    // horizontal scroll (RTL: positive translate reveals items to the left)
    var shift = Math.max(0, Math.min(i - (VISIBLE - 2), appEls[r].length - VISIBLE)) * TILE;
    rowEls[r].querySelector(".track").style.transform = "translateX(" + shift + "px)";
    // vertical scroll
    rowsEl.style.transform = "translateY(" + (-Math.max(0, r - 1) * ROWH) + "px)";
    $("hero").style.opacity = "";
    
    paintHero(ROWS[r].apps[i]);
    sset("sessionStorage", "naaz_focus", JSON.stringify(cur));
  }

  /* ---------- open apps ---------- */
  var mode = "home"; // home | weather | saver | launch
  function toast(t) { var e = $("toast"); e.innerHTML = t; e.className = "on"; setTimeout(function () { e.className = ""; }, 2500); }
  function openApp(a) {
    if (a.type === "weather") { showWeather(); return; }
    if (a.streams && a.streams.length) { playChannel(a); return; }
    if (!a.url) { toast("މި އެޕަށް ލިންކެއް ނެތް"); return; }
    mode = "launch";
    var lt = $("launchTile");
    lt.style.background = "linear-gradient(135deg," + a.color[0] + "," + a.color[1] + ")";
    lt.innerHTML = appEls[cur.r][cur.i].querySelector(".tile").innerHTML;
    $("launch").className = "panel on";
    setTimeout(function () { window.location.href = a.url; }, 650);
  }
  window.addEventListener("pageshow", function () { // coming back with the Back button
    $("launch").className = "panel"; if (mode === "launch") mode = "home";
  });

  /* ---------- weather ---------- */
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + SETTINGS.latitude + "&longitude=" + SETTINGS.longitude +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=6";
    var x = new XMLHttpRequest();
    x.open("GET", url, true); x.timeout = 15000;
    x.onload = function () {
      if (x.status !== 200) return;
      try { lastWx = JSON.parse(x.responseText); sset("localStorage", "naaz_wx", x.responseText); paintWeatherBits(); } catch (e) {}
    };
    x.send();
  }
  var cached = sget("localStorage", "naaz_wx");
  if (cached) { try { lastWx = JSON.parse(cached); } catch (e) {} }

  function paintWeatherBits() {
    if (!lastWx) return;
    var c = lastWx.current;
    $("topTemp").innerHTML = wxIcon(c.weather_code, c.is_day) + '<span class="ltr">' + Math.round(c.temperature_2m) + "°</span>";
    var a = ROWS[cur.r].apps[cur.i];
    if (a.type === "weather" && mode === "home") $("heroMeta").innerHTML = heroMeta(a);
    if (mode === "weather") renderWeather();
  }
  function renderWeather() {
    $("wTitle").innerHTML = SETTINGS.placeName + " — " + dateStr(new Date());
    if (!lastWx) { $("wCond").innerHTML = "މޫސުމުގެ މަޢުލޫމާތު ލިބެމުންދަނީ..."; return; }
    var c = lastWx.current, d = lastWx.daily;
    $("wIcon").innerHTML = wxIcon(c.weather_code, c.is_day);
    $("wTemp").innerHTML = '<span class="ltr">' + Math.round(c.temperature_2m) + "°</span>";
    $("wCond").innerHTML = wxText(c.weather_code);
    $("wStats").innerHTML =
      '<div><span>ހިސްވާ ގޮތުން</span><span class="ltr">' + Math.round(c.apparent_temperature) + "°</span></div>" +
      '<div><span>ތެތްމިން</span><span class="ltr">' + c.relative_humidity_2m + "%</span></div>" +
      '<div><span>ވައި</span><span class="ltr">' + Math.round(c.wind_speed_10m) + " km/h</span></div>" +
      '<div><span>މިއަދު</span><span class="ltr">' + Math.round(d.temperature_2m_max[0]) + "° / " + Math.round(d.temperature_2m_min[0]) + "°</span></div>";
    var h = "";
    for (var k = 1; k < d.time.length; k++) {
      var dt = new Date(d.time[k] + "T12:00:00");
      h += '<div class="day"><div>' + (k === 1 ? "މާދަމާ" : DAYS[dt.getDay()]) + "</div>" + wxIcon(d.weather_code[k], 1) +
        '<div class="hi ltr">' + Math.round(d.temperature_2m_max[k]) + '°</div> <div class="lo ltr">' + Math.round(d.temperature_2m_min[k]) + "°</div>" +
        '<div class="rp">ވާރޭ <span class="ltr">' + (d.precipitation_probability_max[k] == null ? "–" : d.precipitation_probability_max[k] + "%") + "</span></div></div>";
    }
    $("wDays").innerHTML = h;
  }
  function showWeather() { mode = "weather"; renderWeather(); $("weather").className = "panel on"; loadWeather(); }
  function closePanels() { $("weather").className = "panel"; $("saver").className = "panel"; mode = "home"; }


  /* ---------- full-screen live player ---------- */
  var vid = $("vid"), hls = null, attempts = [], pTimer = null, infoTimer = null, playing = null;
  var LIVE = all.filter(function (a) { return a.streams && a.streams.length; });
  var canNative = !!(vid.canPlayType && vid.canPlayType("application/vnd.apple.mpegurl"));
  var canHls = !!(window.Hls && window.Hls.isSupported());
  var viaLaptop = location.protocol === "http:";
  function pMsg(t, spin) { $("pMsg").innerHTML = t ? (spin ? '<span class="spin"></span>' : "") + t : ""; }
  function showInfo() {
    $("pInfo").className = ""; clearTimeout(infoTimer);
    infoTimer = setTimeout(function () { $("pInfo").className = "hide"; }, 4000);
  }
  function cleanup() {
    clearTimeout(pTimer);
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    vid.onerror = vid.onplaying = null;
    try { vid.pause(); vid.removeAttribute("src"); vid.load(); } catch (e) {}
  }
  function playChannel(a) {
    cleanup(); playing = a; mode = "player";
    $("pName").innerHTML = a.name; showInfo();
    $("player").className = "panel on";
    pMsg("ސްޓްރީމް ލޯޑުވަނީ...", true);
    attempts = [];
    a.streams.forEach(function (u) {
      if (canNative) attempts.push({ how: "native", src: u });
      if (canHls) attempts.push({ how: "hls", src: u });
    });
    if (viaLaptop) a.streams.forEach(function (u) {
      var px = "/proxy?u=" + encodeURIComponent(u);
      if (canHls) attempts.push({ how: "hls", src: px });
      else if (canNative) attempts.push({ how: "native", src: px });
    });
    nextAttempt();
  }
  function nextAttempt() {
    cleanup();
    var at = attempts.shift();
    if (!at) {
      if (playing && playing.url) { pMsg("ސްޓްރީމް ނުލިބުނު — ވެބްސައިޓް ހުޅުވަނީ..."); var u = playing.url; setTimeout(function () { window.location.href = u; }, 1500); }
      else pMsg("ސްޓްރީމް ނުލިބުނު");
      return;
    }
    pTimer = setTimeout(nextAttempt, 15000);            // give each try 15 s
    vid.onplaying = function () { clearTimeout(pTimer); pMsg(""); };
    if (at.how === "native") {
      vid.onerror = function () { nextAttempt(); };
      vid.src = at.src;
      var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {});
    } else {
      hls = new window.Hls({ maxBufferLength: 20, backBufferLength: 10, enableWorker: true });
      hls.on(window.Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) nextAttempt(); });
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () { var p2 = vid.play(); if (p2 && p2.catch) p2.catch(function () {}); });
      hls.loadSource(at.src); hls.attachMedia(vid);
    }
  }
  function zap(step) {
    if (!LIVE.length || !playing) return;
    var k = LIVE.indexOf(playing); if (k < 0) k = 0;
    playChannel(LIVE[(k + step + LIVE.length) % LIVE.length]);
  }
  function stopPlayer() {
    cleanup(); playing = null; pMsg("");
    $("player").className = "panel"; mode = "home";
  }
  $("player").addEventListener("click", showInfo);

  /* ---------- clock ---------- */
  function tick() {
    var d = new Date();
    $("topClock").innerHTML = timeStr(d, true);
    $("greet").innerHTML = greeting(d.getHours()) + " · " + dateStr(d);
    if (mode === "saver") {
      $("svClock").innerHTML = timeStr(d, false);
      $("svDate").innerHTML = dateStr(d);
      $("svTemp").innerHTML = lastWx ? SETTINGS.placeName + ' · <span class="ltr">' + Math.round(lastWx.current.temperature_2m) + "°</span> " + wxText(lastWx.current.weather_code) : "";
    }
  }

  /* ---------- screensaver ---------- */
  var SV_COLORS = [["#0a84ff", "#5e5ce6"], ["#ff9f0a", "#ff375f"], ["#30d158", "#0a84ff"], ["#bf5af2", "#ff375f"], ["#64d2ff", "#30d158"]];
  var svIdx = 0, svFlip = false, svTimer = null, idleAt = Date.now();
  function svStep() {
    if (document.body.className === "hasWall") {
      var ph = (svIdx % 3 === 0);
      $("svPhoto").className = ph ? "on" : "";
      $("saver").className = "panel on" + (ph ? " photo" : "");
    }
    var c = SV_COLORS[svIdx++ % SV_COLORS.length];
    var el = svFlip ? $("svA") : $("svB"), other = svFlip ? $("svB") : $("svA");
    el.style.background = "radial-gradient(ellipse at 30% 30%," + c[0] + " 0%, transparent 60%), radial-gradient(ellipse at 75% 80%," + c[1] + " 0%, transparent 60%), #000";
    el.className = "sv on"; other.className = "sv"; svFlip = !svFlip;
  }
  function startSaver() { mode = "saver"; $("weather").className = "panel"; tick(); $("saver").className = "panel on"; svStep(); svTimer = setInterval(svStep, 12000); }
  function stopSaver() { clearInterval(svTimer); closePanels(); }
  setInterval(function () {
    if (SETTINGS.screensaverMinutes > 0 && mode !== "saver" && mode !== "launch" && mode !== "player" && Date.now() - idleAt > SETTINGS.screensaverMinutes * 60000) startSaver();
  }, 10000);

  /* ---------- remote keys ---------- */
  var BACK = { 8: 1, 27: 1, 461: 1, 10009: 1, 166: 1 };
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode; idleAt = Date.now();
    if (mode === "launch") return;
    if (mode === "player") {
      e.preventDefault();
      if (BACK[k]) stopPlayer();
      else if (k === 38 || k === 33 || k === 427) zap(-1);
      else if (k === 40 || k === 34 || k === 428) zap(1);
      else showInfo();
      return;
    }
    if (mode === "saver") { e.preventDefault(); stopSaver(); return; }
    if (mode === "weather") { if (BACK[k] || k === 13) { e.preventDefault(); closePanels(); } return; }
    var r = cur.r, i = cur.i, n = appEls[r].length;
    if (k === 37) { e.preventDefault(); if (i < n - 1) focus(r, i + 1); }      // left = next (RTL)
    else if (k === 39) { e.preventDefault(); if (i > 0) focus(r, i - 1); }     // right = previous
    else if (k === 40) { e.preventDefault(); if (r < ROWS.length - 1) focus(r + 1, Math.min(i, appEls[r + 1].length - 1)); }
    else if (k === 38) { e.preventDefault(); if (r > 0) focus(r - 1, Math.min(i, appEls[r - 1].length - 1)); }
    else if (k === 13) { e.preventDefault(); openApp(ROWS[r].apps[i]); }
    else if (BACK[k]) { e.preventDefault(); if (r !== 0 || i !== 0) focus(0, 0); }
  });

  /* ---------- pointer (VIDAA phone remote / air mouse) ---------- */
  var lastHover = 0;
  rowsEl.addEventListener("mousemove", function (e) {
    idleAt = Date.now();
    var t = e.target; while (t && t !== rowsEl && !(t.className && /\bapp\b/.test(t.className))) t = t.parentNode;
    if (!t || t === rowsEl) return;
    var r = +t.getAttribute("data-r"), i = +t.getAttribute("data-i");
    if ((r !== cur.r || i !== cur.i) && Date.now() - lastHover > 120) { lastHover = Date.now(); focus(r, i); }
  });
  rowsEl.addEventListener("click", function () { if (mode === "home") openApp(ROWS[cur.r].apps[cur.i]); });
  document.addEventListener("mousemove", function () { idleAt = Date.now(); });
  $("weather").addEventListener("click", closePanels);
  $("saver").addEventListener("click", stopSaver);
  $("saver").addEventListener("mousemove", function () { if (mode === "saver") stopSaver(); });

  /* ---------- start ---------- */
  tick(); setInterval(tick, 1000);
  paintWeatherBits(); loadWeather(); setInterval(loadWeather, 20 * 60000);
  focus(cur.r, cur.i);
})();
</script>
</body>
</html>
