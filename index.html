    display: grid;
    grid-template-columns: 1fr 1fr 640px;
    grid-template-rows: 210px minmax(0,1fr) 180px;
    grid-template-areas:
      "clock clock prayer"
      "weather weather prayer"
      "links links links";
    grid-column-gap: 40px; grid-row-gap: 36px;
  }

  .card {
    background: rgba(255,255,255,.055);
    border: 3px solid rgba(255,255,255,.08);
    border-radius: 28px; box-sizing: border-box;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .label { font-size: 32px; line-height: 1.3; letter-spacing: 0; color: #8ea3c4; font-weight: 600; }

  /* ---------- Focus state: unmistakable from 3 m away ---------- */
  .focusable { outline: none; }
  .focusable.focused {
    border-color: #ffd23f;
    box-shadow: 0 0 0 4px rgba(255,210,63,.35), 0 0 42px rgba(255,210,63,.45);
    transform: scale(1.06);
    background: rgba(255,255,255,.12);
    z-index: 2;
  }

  /* ---------- Clock ---------- */
  #clock { grid-area: clock; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  #time { direction: ltr; unicode-bidi: embed; font-size: 165px; font-weight: 300; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  #time small { font-size: 52px; color: #8ea3c4; letter-spacing: 0; margin-left: 12px; font-family: "Faruma", "Segoe UI", Roboto, sans-serif; }
  #dates { text-align: left; white-space: nowrap; }
  #greg { font-size: 46px; font-weight: 600; }
  #hijri { font-size: 32px; color: #9fd8c9; margin-top: 6px; }
  #toolbar { margin-top: 16px; }
  .btn {
    display: inline-block; font-size: 28px; padding: 12px 26px; margin-right: 14px;
    border-radius: 16px; border: 3px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }

  /* ---------- Weather ---------- */
  #weather { grid-area: weather; padding: 26px 44px; display: flex; flex-direction: column; overflow: hidden; }
  #wx-now { display: flex; align-items: center; margin-top: 4px; }
  #wx-icon { width: 130px; height: 130px; margin-left: 34px; }
  #wx-temp { font-size: 108px; font-weight: 300; line-height: 1; }
  #wx-desc { font-size: 38px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
  #wx-meta { font-size: 28px; color: #b6c4da; line-height: 1.3; margin-top: 4px; }
  #wx-days { display: flex; margin-top: auto; }
  .day { flex: 1; text-align: center; padding: 12px 8px; margin-left: 16px; border-radius: 20px; background: rgba(255,255,255,.04); }
  .day:last-child { margin-left: 0; }
  .day .d { font-size: 26px; line-height: 1.3; color: #8ea3c4; font-weight: 600; }
  .day svg { width: 52px; height: 52px; margin: 0; }
  .day .t { font-size: 32px; direction: ltr; } .day .t span { color: #8ea3c4; }
  .day .r { font-size: 22px; line-height: 1.3; color: #7cc4ff; margin-top: 2px; }

  /* ---------- Prayer ---------- */
  #prayer { grid-area: prayer; padding: 26px 40px; display: flex; flex-direction: column; overflow: hidden; }
  #next-box { margin: 10px 0 12px; padding: 14px 26px; border-radius: 22px; background: linear-gradient(135deg, rgba(0,200,170,.25), rgba(56,132,255,.18)); }
  #next-name { font-size: 42px; font-weight: 700; line-height: 1.3; }
  #next-count { direction: ltr; unicode-bidi: embed; text-align: right; font-size: 60px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .prow { display: flex; justify-content: space-between; align-items: center; font-size: 44px; line-height: 1.25; padding: 10px 22px; border-radius: 18px; }
  .prow .n { color: #c9d5e8; } .prow .v { direction: ltr; unicode-bidi: embed; font-variant-numeric: tabular-nums; font-weight: 600; }
  .prow.past { opacity: .45; }
  .prow.next { background: rgba(255,210,63,.14); color: #ffd23f; } .prow.next .n { color: #ffd23f; }

  /* ---------- Links ---------- */
  #links { grid-area: links; display: flex; align-items: stretch; }
  .tile {
    flex: 1; margin-left: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 600; text-align: center;
  }
  .tile:last-child { margin-left: 0; }
  .tile .ic { width: 84px; height: 84px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 800; margin-bottom: 14px; color: #fff; font-family: "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: -1px; }
  .tile { font-size: 40px; }

  /* ---------- Full-screen live player ---------- */
  #player { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: none; }
  #player.on { display: block; }
  #player video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #p-osd { position: absolute; top: 4%; right: 3%; padding: 14px 28px; border-radius: 18px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 34px; line-height: 1.4; transition: opacity .6s ease; }
  #p-osd.hide { opacity: 0; }
  #p-osd small { display: block; font-size: 22px; color: #b6c4da; }
  #status { position: absolute; left: 72px; top: 14px; font-size: 24px; color: #5d6f8c; }
  .muted { color: #5d6f8c; }
</style>
</head>
<body>
<div id="stage">

  <section id="clock">
    <div id="time">--:--</div>
    <div id="dates">
      <div id="greg">&nbsp;</div>
      <div id="hijri">&nbsp;</div>
      <div id="toolbar">
        <span class="btn focusable" data-action="toggle24">12 / 24 ގަޑި</span>
        <span class="btn focusable" data-action="refresh">އާކުރޭ</span>
      </div>
    </div>
  </section>

  <section id="weather" class="card focusable" data-action="refresh">
    <div class="label" id="wx-place">މޫސުން</div>
    <div id="wx-now">
      <div id="wx-icon"></div>
      <div>
        <div id="wx-temp">--°</div>
        <div id="wx-desc">ލޯޑުވަނީ…</div>
        <div id="wx-meta">&nbsp;</div>
      </div>
    </div>
    <div id="wx-days"></div>
  </section>

  <section id="prayer" class="card focusable" data-action="refresh">
    <div class="label">ނަމާދު ވަގުތު</div>
    <div id="next-box">
      <div id="next-name">—</div>
      <div id="next-count">--:--:--</div>
    </div>
    <div id="prayer-list"></div>
  </section>

  <section id="links"></section>

  <div id="status"></div>
</div>

<div id="player"><video id="pv" playsinline></video><div id="p-osd"></div></div>

<script>
/* =====================================================================
   SETTINGS — edit these to customise your dashboard
   ===================================================================== */
var CONFIG = {
  placeName: "ށ. ފުނަދޫ",
  latitude: 6.1500,
  longitude: 73.2900,
  timezone: "Indian/Maldives",
  use24h: true,
  // Prayer calculation (AlAdhan API). method 1 = Karachi (Fajr/Isha 18°), school 0 = Shafi'i Asr.
  // "tune" adds minutes per prayer to match official local times:
  // Imsak,Fajr,Sunrise,Dhuhr,Asr,Maghrib,Sunset,Isha,Midnight
  prayerMethod: 1,
  prayerSchool: 0,
  prayerTune: "0,0,0,0,0,0,0,0,0",
  // Quick-link tiles. "color" is the icon background, "icon" is 1–2 letters.
  links: [
    { name: "ޔޫޓިއުބް",      url: "https://www.youtube.com/tv",       icon: "▶",   color: "#e62117" },
    // "stream" = direct HLS (.m3u8) address → plays full-screen inside the dashboard.
    // Without "stream" (or if the TV can't play it) the tile opens the website instead.
    { name: "ރާއްޖެ ޓީވީ",   url: "https://stream.raajje.mv/",        icon: "R",   color: "#d9381e",
      stream: "https://stream.raajje.mv/live/stream_c95ravtr7cyk/index.m3u8" },
    { name: "ޓީވީއެމް",      url: "https://psmnews.mv/stream/tvm",    icon: "TVM", color: "#1d5fd1", small: true },
    { name: "ޔެސް ޓީވީ",     url: "https://psmnews.mv/stream/yes-tv", icon: "YES", color: "#e8a20c", small: true }
  ],
  weatherRefreshMin: 30
};

/* =====================================================================
   Utilities (written in ES5 style for older TV browser engines)
   ===================================================================== */
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function store(k, v) { try { if (v === undefined) { return JSON.parse(localStorage.getItem(k)); } localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function getJSON(url, ok, fail) {
  var x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.timeout = 15000;
  x.onload = function () { if (x.status >= 200 && x.status < 300) { try { ok(JSON.parse(x.responseText)); } catch (e) { fail && fail(e); } } else { fail && fail(x.status); } };
  x.onerror = x.ontimeout = function () { fail && fail("network"); };
  x.send();
}
// Current time in the configured timezone (the TV clock may be set to another zone)
function nowLocal() {
  var d = new Date();
  try {
    var s = d.toLocaleString("en-US", { timeZone: CONFIG.timezone });
    var p = new Date(s);
    if (!isNaN(p.getTime())) return p;
  } catch (e) {}
  // Fallback: Maldives is UTC+5 all year
  return new Date(d.getTime() + (d.getTimezoneOffset() + 300) * 60000);
}
var saved24 = store("use24h"); if (saved24 !== null) CONFIG.use24h = saved24;

/* =====================================================================
   Stage scaling — design at 1920x1080, fit to 720p/1080p/4K viewports
   ===================================================================== */
function fitStage() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var st = $("stage");
  st.style.transform = "scale(" + s + ")";
  st.style.left = ((window.innerWidth - 1920 * s) / 2) + "px";
  st.style.top = ((window.innerHeight - 1080 * s) / 2) + "px";
}
window.addEventListener("resize", fitStage);

/* =====================================================================
   Clock
   ===================================================================== */
var DAYS = ["އާދިއްތަ","ހޯމަ","އަންގާރަ","ބުދަ","ބުރާސްފަތި","ހުކުރު","ހޮނިހިރު"];
var MONTHS = ["ޖަނަވަރީ","ފެބުރުއަރީ","މާރިޗު","އޭޕްރީލް","މެއި","ޖޫން","ޖުލައި","އޯގަސްޓް","ސެޕްޓެމްބަރު","އޮކްޓޫބަރު","ނޮވެމްބަރު","ޑިސެމްބަރު"];
var HIJRI_MONTHS = ["މުޙައްރަމް","ޞަފަރު","ރަބީޢުލްއައްވަލް","ރަބީޢުލްއާޚިރު","ޖުމާދަލްއޫލާ","ޖުމާދަލްއާޚިރާ","ރަޖަބު","ޝަޢުބާން","ރަމަޟާން","ޝައްވާލް","ޛުލްޤަޢިދާ","ޛުލްޙިއްޖާ"];
var AM = "މކ", PM = "މފ";
function renderClock() {
  var d = nowLocal(), h = d.getHours(), m = d.getMinutes(), suffix = "";
  if (!CONFIG.use24h) { suffix = h >= 12 ? PM : AM; h = h % 12 || 12; }
  $("time").innerHTML = (CONFIG.use24h ? pad(h) : h) + ":" + pad(m) + "<small>" + (CONFIG.use24h ? pad(d.getSeconds()) : suffix) + "</small>";
  $("greg").textContent = DAYS[d.getDay()] + "، " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function fmtTime(hhmm) {
  var p = hhmm.split(":"), h = +p[0], m = p[1];
  if (CONFIG.use24h) return pad(h) + ":" + m;
  return (h % 12 || 12) + ":" + m + " " + (h >= 12 ? PM : AM);
}

/* =====================================================================
   Weather (Open-Meteo — free, no API key)
   ===================================================================== */
var ICONS = {
  sun: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="13" fill="#ffd23f"/><g stroke="#ffd23f" stroke-width="4" stroke-linecap="round"><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7"/></g></svg>',
  partly: '<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="11" fill="#ffd23f"/><path d="M22 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27 4 8 8 0 0 0 1 16z" fill="#dfe7f3"/></svg>',
  cloud: '<svg viewBox="0 0 64 64"><path d="M16 48h32a12 12 0 0 0 0-24 16 16 0 0 0-31 5 9.5 9.5 0 0 0-1 19z" fill="#c3cfdf"/></svg>',
  fog: '<svg viewBox="0 0 64 64"><path d="M16 36h32a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-3 18z" fill="#aab6c8"/><g stroke="#aab6c8" stroke-width="4" stroke-linecap="round"><path d="M12 44h40M18 52h28"/></g></svg>',
  rain: '<svg viewBox="0 0 64 64"><path d="M16 38h32a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-3 18z" fill="#aebbd0"/><g stroke="#4fb3ff" stroke-width="4" stroke-linecap="round"><path d="M22 44l-3 8M33 44l-3 8M44 44l-3 8"/></g></svg>',
  storm: '<svg viewBox="0 0 64 64"><path d="M16 36h32a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-3 18z" fill="#8d9ab0"/><path d="M34 38l-8 12h7l-4 10 12-15h-7l4-7z" fill="#ffd23f"/></svg>'
};
function wxInfo(code) {
  if (code === 0) return ["sun", "ސާފު އުޑު"];
  if (code === 1) return ["sun", "ގިނަގޮތެއްގައި ސާފު"];
  if (code === 2) return ["partly", "ބައެއް ވިލާ"];
  if (code === 3) return ["cloud", "ވިލާގަނޑު"];
  if (code === 45 || code === 48) return ["fog", "ދުމާވެފައި"];
  if (code >= 51 && code <= 57) return ["rain", "ކުދިކުދި ވާރޭ"];
  if (code >= 61 && code <= 67) return ["rain", code >= 65 ? "ބޮޑު ވާރޭ" : "ވާރޭ"];
  if (code >= 80 && code <= 82) return ["rain", code === 82 ? "ވަރުގަދަ ވާރޭ" : "ވާރޭ ވެހުން"];
  if (code >= 95) return ["storm", "ގުގުރުމާއި ވިދުވަރު"];
  return ["cloud", "ވިލާ"];
}
function compass(deg) { return ["އުތުރު","އުތުރުއިރުމަތި","އިރުމަތި","ދެކުނުއިރުމަތި","ދެކުނު","ދެކުނުހުޅަނގު","ހުޅަނގު","އުތުރުހުޅަނގު"][Math.round(deg / 45) % 8]; }
function renderWeather(w) {
  if (!w || !w.current) return;
  var c = w.current, info = wxInfo(c.weather_code);
  $("wx-place").textContent = "މޫސުން · " + CONFIG.placeName;
  $("wx-icon").innerHTML = ICONS[info[0]];
  $("wx-temp").textContent = Math.round(c.temperature_2m) + "°C";
  $("wx-desc").textContent = info[1];
  $("wx-meta").textContent = "ހީވަނީ " + Math.round(c.apparent_temperature) + "°  ·  ތެތްމިން " + c.relative_humidity_2m +
    "%  ·  ވައި " + Math.round(c.wind_speed_10m) + " ކ.މ/ގ " + compass(c.wind_direction_10m);
  var html = "", dl = w.daily;
  for (var i = 0; i < Math.min(5, dl.time.length); i++) {
    var p = dl.time[i].split("-"), dd = new Date(+p[0], +p[1] - 1, +p[2]);
    var di = wxInfo(dl.weather_code[i]);
    html += '<div class="day"><div class="d">' + (i === 0 ? "މިއަދު" : DAYS[dd.getDay()]) + '</div>' + ICONS[di[0]] +
      '<div class="t">' + Math.round(dl.temperature_2m_max[i]) + '° <span>' + Math.round(dl.temperature_2m_min[i]) + '°</span></div>' +
      '<div class="r">' + (dl.precipitation_probability_max[i] == null ? "" : "ވާރޭ <span dir=\"ltr\">" + dl.precipitation_probability_max[i] + "%</span>") + '</div></div>';
  }
  $("wx-days").innerHTML = html;
}
function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5" +
    "&timezone=" + encodeURIComponent(CONFIG.timezone);
  getJSON(url, function (w) { store("wx", w); renderWeather(w); setStatus(); },
    function () { renderWeather(store("wx")); setStatus("މޫސުމުގެ މަޢުލޫމާތު ނުލިބުނު — ކުރިން ރައްކާކުރި މަޢުލޫމާތު"); });
}

/* =====================================================================
   Prayer times (AlAdhan — free, no API key)
   ===================================================================== */
var PRAYERS = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
var PRAYER_DV = { Fajr: "ފަތިސް", Sunrise: "އިރުއަރާ", Dhuhr: "މެންދުރު", Asr: "އަޞްރު", Maghrib: "މަޣްރިބް", Isha: "ޢިޝާ" };
var prayerData = null;
function loadPrayer() {
  var d = nowLocal(), key = "pt-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  var cached = store(key);
  if (cached) { prayerData = cached; renderPrayer(); return; }
  var url = "https://api.aladhan.com/v1/timings/" + pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear() +
    "?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude + "&method=" + CONFIG.prayerMethod +
    "&school=" + CONFIG.prayerSchool + "&tune=" + CONFIG.prayerTune + "&timezonestring=" + encodeURIComponent(CONFIG.timezone);
  getJSON(url, function (r) {
    if (r && r.data) { prayerData = r.data; store(key, r.data); renderPrayer(); }
  }, function () { setStatus("ނަމާދު ވަގުތު ނުލިބުނު"); });
}
function toMin(hhmm) { var p = hhmm.replace(/\s.*$/, "").split(":"); return +p[0] * 60 + +p[1]; }
function renderPrayer() {
  if (!prayerData) return;
  var t = prayerData.timings, d = nowLocal();
  var nowSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  var next = null, html = "";
  for (var i = 0; i < PRAYERS.length; i++) {
    if (PRAYERS[i] === "Sunrise") continue;
    if (next === null && toMin(t[PRAYERS[i]]) * 60 > nowSec) next = PRAYERS[i];
  }
  var nextSec, nextName = next;
  if (next) { nextSec = toMin(t[next]) * 60; }
  else { nextName = "Fajr"; nextSec = toMin(t.Fajr) * 60 + 86400; } // tomorrow (approx.)
  for (var j = 0; j < PRAYERS.length; j++) {
    var n = PRAYERS[j], cls = "prow";
    if (n === next) cls += " next";
    else if (toMin(t[n]) * 60 <= nowSec) cls += " past";
    html += '<div class="' + cls + '"><span class="n">' + PRAYER_DV[n] + '</span><span class="v">' + fmtTime(t[n].replace(/\s.*$/, "")) + '</span></div>';
  }
  $("prayer-list").innerHTML = html;
  var left = nextSec - nowSec;
  $("next-name").textContent = "ދެން: " + PRAYER_DV[nextName];
  $("next-count").textContent = pad(Math.floor(left / 3600)) + ":" + pad(Math.floor(left % 3600 / 60)) + ":" + pad(left % 60);
  if (prayerData.date && prayerData.date.hijri) {
    var h = prayerData.date.hijri;
    $("hijri").textContent = (+h.day) + " " + (HIJRI_MONTHS[h.month.number - 1] || h.month.en) + " " + h.year + " ހ.";
  }
}

/* =====================================================================
   Quick links
   ===================================================================== */
function renderLinks() {
  var html = "";
  for (var i = 0; i < CONFIG.links.length; i++) {
    var l = CONFIG.links[i];
    html += '<div class="card tile focusable" data-url="' + l.url + '" data-index="' + i + '"><div class="ic" style="background:' + l.color + (l.small ? ';font-size:30px' : '') + '">' + l.icon + '</div>' + l.name + '</div>';
  }
  $("links").innerHTML = html;
}

/* =====================================================================
   Spatial (D-pad) navigation
   ===================================================================== */
var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13 };
var current = null;
function focusables() { return Array.prototype.slice.call(document.querySelectorAll(".focusable")); }
function setFocus(el) {
  if (!el) return;
  if (current) current.classList.remove("focused");
  current = el; el.classList.add("focused");
  var idx = focusables().indexOf(el); store("focusIdx", idx);
}
function rect(el) {
  // Use un-scaled geometry so the "zoomed" focused card doesn't skew distances
  var r = el.getBoundingClientRect();
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, l: r.left, r: r.right, t: r.top, b: r.bottom };
}
function move(dir) {
  if (!current) { setFocus(focusables()[0]); return; }
  var a = rect(current), best = null, bestScore = Infinity, list = focusables();
  for (var i = 0; i < list.length; i++) {
    var el = list[i]; if (el === current) continue;
    var b = rect(el), dx = b.cx - a.cx, dy = b.cy - a.cy, primary, secondary;
    // secondary = gap along the other axis (0 when the two items line up / overlap)
    var gapX = Math.max(0, b.l - a.r, a.l - b.r), gapY = Math.max(0, b.t - a.b, a.t - b.b);
    if (dir === "LEFT")  { if (b.cx >= a.cx - 5) continue; primary = Math.max(0, a.l - b.r); secondary = gapY; }
    if (dir === "RIGHT") { if (b.cx <= a.cx + 5) continue; primary = Math.max(0, b.l - a.r); secondary = gapY; }
    if (dir === "UP")    { if (b.cy >= a.cy - 5) continue; primary = Math.max(0, a.t - b.b); secondary = gapX; }
    if (dir === "DOWN")  { if (b.cy <= a.cy + 5) continue; primary = Math.max(0, b.t - a.b); secondary = gapX; }
    var score = primary + secondary * 2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) setFocus(best);
}
function activate(el) {
  if (!el) return;
  var url = el.getAttribute("data-url"), action = el.getAttribute("data-action");
  var li = el.getAttribute("data-index"), link = li !== null ? CONFIG.links[+li] : null;
  if (link && link.stream && canPlayHLS()) { openPlayer(link); return; }
  if (url) { window.location.href = url; return; }
  if (action === "refresh") { setStatus("އާކުރަނީ…"); loadWeather(); prayerData = null; clearPrayerCache(); loadPrayer(); }
  if (action === "toggle24") { CONFIG.use24h = !CONFIG.use24h; store("use24h", CONFIG.use24h); renderClock(); renderPrayer(); }
}
function clearPrayerCache() {
  try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf("pt-") === 0) localStorage.removeItem(k); } } catch (e) {}
}
document.addEventListener("keydown", function (e) {
  var k = e.keyCode || e.which;
  if (playerOpen) {
    // Back on VIDAA remotes arrives as 8 (some models 461/10009); Esc for PC testing
    if (k === 8 || k === 27 || k === 461 || k === 10009) { closePlayer(); e.preventDefault(); return; }
    if (k === KEY.UP || k === KEY.DOWN) { switchChannel(k === KEY.UP ? -1 : 1); e.preventDefault(); return; }
    if (k === KEY.ENTER && $("pv").muted) { $("pv").muted = false; }
    showOSD(); e.preventDefault(); return;
  }
  if (k === KEY.LEFT)  { move("LEFT");  e.preventDefault(); }
  else if (k === KEY.RIGHT) { move("RIGHT"); e.preventDefault(); }
  else if (k === KEY.UP)    { move("UP");    e.preventDefault(); }
  else if (k === KEY.DOWN)  { move("DOWN");  e.preventDefault(); }
  else if (k === KEY.ENTER) { activate(current); e.preventDefault(); }
});
// Mouse / pointer remotes (VIDAA "air mouse") also work
document.addEventListener("mouseover", function (e) { var el = e.target.closest ? e.target.closest(".focusable") : null; if (el) setFocus(el); });
document.addEventListener("click", function (e) { var el = e.target.closest ? e.target.closest(".focusable") : null; if (el) { setFocus(el); activate(el); } });

/* =====================================================================
   Full-screen live player (native HLS in the TV's video engine)
   ===================================================================== */
var playerOpen = false, playing = null, osdTimer = null, failTimer = null;
function canPlayHLS() {
  var v = document.createElement("video");
  return !!(v.canPlayType("application/vnd.apple.mpegurl") || v.canPlayType("application/x-mpegURL"));
}
function showOSD(msg) {
  var o = $("p-osd");
  o.innerHTML = (playing ? playing.name : "") + "<small>" + (msg || "↑ ↓ ޗެނަލް ބަދަލުކުރުމަށް  ·  Back ނިކުތުމަށް") + "</small>";
  o.className = "";
  clearTimeout(osdTimer);
  osdTimer = setTimeout(function () { o.className = "hide"; }, 4000);
}
function openPlayer(link) {
  var v = $("pv");
  playing = link; playerOpen = true;
  $("player").className = "on";
  showOSD("ލޯޑުވަނީ…");
  v.muted = false; v.src = link.stream;
  var p = v.play(); if (p && p.catch) p.catch(function () { v.muted = true; var p2 = v.play(); if (p2 && p2.catch) p2.catch(function () {}); showOSD("އަޑު ހުޅުވުމަށް OK"); });
  // Try real full-screen too (hides the browser's own bars where allowed)
  var de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
  if (rf) { try { rf.call(de); } catch (e) {} }
  clearTimeout(failTimer);
  v.onplaying = function () { clearTimeout(failTimer); showOSD(); };
  v.onerror = function () { fallback(link); };
  failTimer = setTimeout(function () { if (v.readyState < 2) fallback(link); }, 20000);
}
function fallback(link) {
  showOSD("ސްޓްރީމް ނުކުޅެވުނު — ވެބްސައިޓް ހުޅުވަނީ…");
  setTimeout(function () { if (playerOpen && playing === link) window.location.href = link.url; }, 2500);
}
function closePlayer() {
  var v = $("pv");
  clearTimeout(failTimer); v.onerror = null; v.pause(); v.removeAttribute("src"); try { v.load(); } catch (e) {}
  playerOpen = false; playing = null; $("player").className = "";
  var xf = document.exitFullscreen || document.webkitExitFullscreen;
  if (xf && (document.fullscreenElement || document.webkitFullscreenElement)) { try { xf.call(document); } catch (e) {} }
}
function switchChannel(dir) {
  var list = [], i;
  for (i = 0; i < CONFIG.links.length; i++) if (CONFIG.links[i].stream) list.push(CONFIG.links[i]);
  if (list.length < 2) { showOSD(); return; }
  var idx = list.indexOf(playing);
  openPlayer(list[(idx + dir + list.length) % list.length]);
}
/* =====================================================================
   Status + boot
   ===================================================================== */
function setStatus(msg) {
  var d = nowLocal();
  $("status").textContent = msg || ("އާކުރީ " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + "  ·  ← ↑ → ↓ ހަރަކާތްކުރުމަށް، OK ހުޅުވުމަށް");
}
function boot() {
  fitStage();
  renderClock(); renderLinks();
  renderWeather(store("wx")); loadWeather(); loadPrayer();
  var idx = store("focusIdx"), list = focusables();
  setFocus(list[idx] || list[list.length - CONFIG.links.length] || list[0]);
  var lastDay = nowLocal().getDate();
  setInterval(function () {
    renderClock(); renderPrayer();
    var day = nowLocal().getDate();
    if (day !== lastDay) { lastDay = day; prayerData = null; loadPrayer(); }  // new day → new prayer times
  }, 1000);
  setInterval(loadWeather, CONFIG.weatherRefreshMin * 60000);
}
boot();
</script>
